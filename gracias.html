<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090c">
  <title>Gracias - KAMEX Tech</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="favicon.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Bricolage+Grotesque:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #5b9bff;
      --secondary: #3e7ff0;
      --accent-rgb: 77, 142, 247;
      --fondo: linear-gradient(135deg, #15181e 0%, #08090c 100%);
      --texto: #e6e9ef;
      --tenue: #9aa3b3;
      --titulo: #ffffff;
      --sobre-azul: #050d1c;
      --tarjeta: rgba(255, 255, 255, 0.05);
      --borde: rgba(255, 255, 255, 0.1);
      --sombra: 0 20px 50px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--fondo);
      font-family: 'Inter', 'Segoe UI', sans-serif;
      color: var(--texto);
      text-align: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 560px;
      width: 100%;
      padding: 56px 40px;
      border-radius: 20px;
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      backdrop-filter: blur(10px);
      box-shadow: var(--sombra);
      animation: pop 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }
    .check {
      width: 84px;
      height: 84px;
      margin: 0 auto 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      box-shadow: 0 10px 30px rgba(var(--accent-rgb), 0.35);
      animation: pop 0.6s 0.15s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .check svg {
      width: 42px;
      height: 42px;
      stroke: var(--sobre-azul);
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 2rem;
      color: var(--titulo);
      margin-bottom: 12px;
    }
    p {
      color: var(--tenue);
      font-size: 1.05rem;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    strong { color: var(--primary); }
    a.btn {
      display: inline-block;
      padding: 14px 34px;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      color: var(--sobre-azul);
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      box-shadow: 0 4px 20px rgba(var(--accent-rgb), 0.3);
      transition: all 0.3s ease;
    }
    a.btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(var(--accent-rgb), 0.45);
    }
    a.btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    .logo {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
      color: var(--titulo);
      font-size: 1.1rem;
      margin-top: 28px;
      display: block;
      letter-spacing: 0.5px;
    }
    .logo span { color: #dcb75a; }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1>¡Gracias por contactarnos!</h1>
    <p>Tu mensaje fue enviado correctamente. En breve el equipo de <strong>KAMEX Tech</strong> se pondrá en contacto contigo.</p>
    <a class="btn" href="/">Volver al inicio</a>
    <span class="logo">KAMEX<span> Tech</span></span>
  </div>
</body>
</html>
